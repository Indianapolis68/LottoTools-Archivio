name: Aggiorna archivio LottoTools

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Pubblicare AggArcMob.txt? (lasciare disattivato per il collaudo)"
        type: boolean
        required: true
        default: false

  schedule:
    # ==========================================
    # CRON ORIGINALI - CONSERVATI PER RIPRISTINO
    # ==========================================
    # - cron: "17 19 * * *"
    # - cron: "47 19 * * *"
    # - cron: "17 20 * * *"
    # - cron: "47 20 * * *"
    # - cron: "17 21 * * *"
    # - cron: "37 22 * * *"
    #   timezone: "Europe/Rome"

    # ==========================================
    # CRON SPERIMENTALI ANTICIPATI
    # ==========================================
    - cron: "17 18 * * *"
      timezone: "Europe/Rome"

    - cron: "47 18 * * *"
      timezone: "Europe/Rome"

    # ==========================================
    # CRON ORIGINALI DI RECUPERO
    # ==========================================
    - cron: "17 20 * * *"

    - cron: "47 20 * * *"

    - cron: "17 21 * * *"

    - cron: "37 22 * * *"
      timezone: "Europe/Rome"

permissions:
  contents: write

concurrency:
  group: lottotools-archivio
  cancel-in-progress: false
  
jobs:
  controllo:
    runs-on: ubuntu-latest

    steps:
      - name: Diagnostica orari GitHub
        shell: bash
        env:
          EVENTO: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          echo "========================================"
          echo " LOTTOOLS - DIAGNOSTICA ORARI"
          echo "========================================"
          echo "Evento: $EVENTO"
          echo "Cron programmato: $CRON"
          echo "Ora UTC: $(date -u '+%d-%m-%Y %H:%M:%S')"
          echo "Ora italiana: $(TZ=Europe/Rome date '+%d-%m-%Y %H:%M:%S %Z')"
          echo "========================================"
      
      - name: Scarica repository
        uses: actions/checkout@v7

      - name: Diagnostica connessione archivio Lotto
        shell: bash
        run: |
          echo "========================================"
          echo " LOTTOOLS - DIAGNOSTICA CONNESSIONE"
          echo "========================================"

          echo "=== RISOLUZIONE DNS ==="
          getent ahosts www.estrazionedellotto.it || true

          echo "=== CONNESSIONE HTTPS IPv4 ==="
          curl -4 -IL --connect-timeout 10 --max-time 20 \
            https://www.estrazionedellotto.it/risultati/archivio-lotto-2026 || true

          echo "=== CONNESSIONE HTTPS IPv6 ==="
          curl -6 -IL --connect-timeout 10 --max-time 20 \
            https://www.estrazionedellotto.it/risultati/archivio-lotto-2026 || true

          echo "========================================"

      - name: Cerca e verifica estrazioni mancanti
        shell: python
        run: |
          from pathlib import Path
          from datetime import datetime, date
          from zoneinfo import ZoneInfo
          from urllib.request import Request, urlopen
          import re
          import json

          # ============================================================
          # COSTANTI
          # ============================================================

          USER_AGENT = "Mozilla/5.0 LottoToolsUpdater/1.0"

          ORDINE_LOTTO_ITALIA = [
              "BA", "CA", "FI", "GE", "MI",
              "NA", "PA", "RM", "TO", "VE", "RN"
          ]


          # ============================================================
          # NUOVA FONTE: ESTRAZIONEDELLOTTO.IT (archivi annuali)
          # ============================================================

          RUOTE = [
              "Bari", "Cagliari", "Firenze", "Genova", "Milano",
              "Napoli", "Palermo", "Roma", "Torino", "Venezia", "Nazionale"
          ]

         
          def scarica_testo(url):
              import time

              for tentativo in range(1, 4):
                  try:
                      print(f"Download {url} - tentativo {tentativo}/3", flush=True)

                      req = Request(
                          url,
                          headers={"User-Agent": USER_AGENT}
                      )

                      with urlopen(req, timeout=45) as response:
                          testo = response.read().decode(
                              "utf-8", errors="replace"
                          )

                      if not testo.strip():
                          raise Exception("Risposta HTML vuota.")

                      print(f"Download riuscito: {len(testo)} caratteri", flush=True)
                      return testo

                  except Exception as ex:
                      print(f"Tentativo {tentativo} fallito: {ex}", flush=True)

                      if tentativo == 3:
                          raise Exception(
                              "Impossibile scaricare la fonte dopo 3 tentativi."
                          ) from ex

                      time.sleep(tentativo * 5)

          def scarica_archivio_annuale(anno):
              url = f"https://www.estrazionedellotto.it/risultati/archivio-lotto-{anno}"
              html = scarica_testo(url)
              rx = re.I | re.S
              blocchi = re.findall(
                  r'<div\s+class="lottoDraws">.*?(?=<div\s+class="lottoDraws">|</div>\s*</div>)',
                  html, rx
              )
              if not blocchi:
                  raise Exception(f"Nessuna estrazione trovata per l'anno {anno}.")

              risultato = []
              progressivi = set()
              date_viste = set()
              for blocco in blocchi:
                  intestazione = re.search(
                      r'Estrazione\s*n\.\s*(\d+).*?del\s*(\d{2}/\d{2}/\d{4})',
                      blocco, rx
                  )
                  if not intestazione:
                      raise Exception("Intestazione estrazione non valida.")
                  progressivo = int(intestazione.group(1))
                  data_estrazione = datetime.strptime(intestazione.group(2), "%d/%m/%Y").date()
                  if data_estrazione.year != anno:
                      raise Exception(f"Anno errato: {data_estrazione}.")
                  if progressivo in progressivi or data_estrazione in date_viste:
                      raise Exception(f"Progressivo o data duplicati: {progressivo}, {data_estrazione}.")
                  progressivi.add(progressivo)
                  date_viste.add(data_estrazione)

                  righe = re.findall(r'<ul\b[^>]*class="ballRow"[^>]*>.*?</ul>', blocco, rx)
                  if len(righe) != 11:
                      raise Exception(f"Numero ruote errato al progressivo {progressivo}.")
                  numeri = [None] * 11
                  for riga in righe:
                      nome = re.search(
                          r'<li\b[^>]*class="wheelTitle[^"]*"[^>]*>\s*([^<]+)\s*</li>',
                          riga, rx
                      )
                      if not nome:
                          raise Exception("Nome ruota non trovato.")
                      nome_ruota = nome.group(1).strip().casefold()
                      indici = [i for i, r in enumerate(RUOTE) if r.casefold() == nome_ruota]
                      if len(indici) != 1 or numeri[indici[0]] is not None:
                          raise Exception(f"Ruota sconosciuta o duplicata: {nome_ruota}.")
                      valori = [int(x) for x in re.findall(
                          r'<li\b[^>]*class="ball"[^>]*>\s*(\d+)\s*</li>', riga, rx
                      )]
                      if len(valori) != 5 or len(set(valori)) != 5 or any(n < 1 or n > 90 for n in valori):
                          raise Exception(f"Estratti non validi: {nome_ruota}, progressivo {progressivo}.")
                      numeri[indici[0]] = valori
                  if any(v is None for v in numeri):
                      raise Exception(f"Ruote mancanti al progressivo {progressivo}.")
                  risultato.append({
                      "progressivo": progressivo,
                      "data": data_estrazione,
                      "numeri": numeri
                  })

              risultato.sort(key=lambda e: e["progressivo"])
              for i, estrazione in enumerate(risultato):
                  if estrazione["progressivo"] != i + 1:
                      raise Exception(f"Progressivo annuale mancante: {i + 1} ({anno}).")
                  if i and estrazione["data"] <= risultato[i - 1]["data"]:
                      raise Exception(f"Date non crescenti nell'anno {anno}.")
              print(f"Archivio {anno}: {len(risultato)} estrazioni verificate.")
              return risultato

          def trova_estrazioni_mancanti(ultima_data_locale, oggi):
              elenco = []
              for anno in range(ultima_data_locale.year, oggi.year + 1):
                  elenco.extend(scarica_archivio_annuale(anno))
              elenco.sort(key=lambda e: e["data"])
              for precedente, corrente in zip(elenco, elenco[1:]):
                  if corrente["data"].year != precedente["data"].year:
                      if corrente["progressivo"] != 1:
                          raise Exception("Progressivo non ripartito da 1 al cambio anno.")
                  elif corrente["progressivo"] != precedente["progressivo"] + 1:
                      raise Exception("Progressivi non consecutivi tra estrazioni.")

              riferimenti_locali = [e for e in elenco if e["data"] == ultima_data_locale]
              if len(riferimenti_locali) != 1:
                  raise Exception("Ultima data GitHub assente dalla nuova fonte: aggiornamento bloccato.")
              ultima_locale = riferimenti_locali[0]
              ultima_riga = righe[-1]
              numeri_locali = [int(ultima_riga[i:i + 2]) for i in range(14, 124, 2)]
              numeri_fonte = [n for ruota in ultima_locale["numeri"] for n in ruota]
              if numeri_locali != numeri_fonte:
                  raise Exception("Ultima estrazione GitHub diversa dalla nuova fonte: aggiornamento bloccato.")
              print("Ultima estrazione GitHub confrontata con la nuova fonte: OK")

              nuove = [e for e in elenco if ultima_data_locale < e["data"] <= oggi]
              # La fonte potrebbe non aver ancora pubblicato l'ultima estrazione:
              # zero nuove righe non dimostra da solo che il sito sia aggiornato.
              print(f"Estrazioni successive presenti nella fonte: {len(nuove)}")
              return nuove


          # ============================================================
          # LOTTO ITALIA
          # ============================================================

          def scarica_estrazione_lotto_italia(data_estrazione):

              url = (
                  "https://www.lotto-italia.it/gdl/"
                  "estrazioni-e-vincite/"
                  "estrazioni-del-lotto.json"
              )

              corpo = json.dumps({
                  "data": data_estrazione.strftime("%Y%m%d")
              }).encode("utf-8")

              req = Request(
                  url,
                  data=corpo,
                  headers={
                      "User-Agent": USER_AGENT,
                      "Content-Type": "application/json"
                  },
                  method="POST"
              )

              with urlopen(req, timeout=30) as response:
                  dati = json.loads(
                      response.read().decode("utf-8")
                  )

              if "esito" not in dati:
                  raise Exception(
                      "Lotto Italia: campo esito mancante."
                  )

              if str(dati["esito"]).upper() != "OK":
                  raise Exception(
                      "Lotto Italia non ha reso disponibile "
                      "l'estrazione del "
                      + data_estrazione.strftime("%d/%m/%Y")
                  )

              if "estrazione" not in dati:
                  raise Exception(
                      "Lotto Italia: estrazione mancante."
                  )

              elenco = dati["estrazione"]

              if len(elenco) != 11:
                  raise Exception(
                      "Numero ruote Lotto Italia non corretto."
                  )

              numeri = []

              for indice, ruota in enumerate(elenco):

                  if "ruota" not in ruota:
                      raise Exception(
                          "Lotto Italia: sigla ruota mancante."
                      )

                  if "numeri" not in ruota:
                      raise Exception(
                          "Lotto Italia: numeri ruota mancanti."
                      )

                  sigla = str(
                      ruota["ruota"]
                  ).upper()

                  if sigla != ORDINE_LOTTO_ITALIA[indice]:
                      raise Exception(
                          "Ordine ruote Lotto Italia non corretto. "
                          + "Attesa "
                          + ORDINE_LOTTO_ITALIA[indice]
                          + ", trovata "
                          + sigla
                      )

                  valori = [
                      int(x)
                      for x in ruota["numeri"]
                  ]

                  if len(valori) != 5:
                      raise Exception(
                          "Numero estratti Lotto Italia "
                          "non corretto."
                      )

                  for valore in valori:
                      if valore < 1 or valore > 90:
                          raise Exception(
                              "Estratto Lotto Italia non valido."
                          )

                  if len(set(valori)) != 5:
                      raise Exception(
                          "Lotto Italia: estratti duplicati "
                          "sulla ruota "
                          + sigla
                          + "."
                      )

                  numeri.append(valori)

              return {
                  "data": data_estrazione,
                  "numeri": numeri
              }


          def confronta(adm, lotto):

              if adm["data"] != lotto["data"]:
                  raise Exception(
                      "Data nuova fonte e Lotto Italia non coincidente."
                  )

              nomi = [
                  "Ba", "Ca", "Fi", "Ge", "Mi",
                  "Na", "Pa", "Ro", "To", "Ve", "Nz"
              ]

              for r in range(11):
                  for n in range(5):

                      if (
                          adm["numeri"][r][n]
                          != lotto["numeri"][r][n]
                      ):
                          raise Exception(
                              "Controllo incrociato fallito - "
                              + adm["data"].strftime("%d/%m/%Y")
                              + " - Ruota "
                              + nomi[r]
                              + " - "
                              + str(n + 1)
                              + "° estratto. Fonte="
                              + str(adm["numeri"][r][n])
                              + " LottoItalia="
                              + str(lotto["numeri"][r][n])
                          )


          # ============================================================
          # CREAZIONE RIGA LOTTOOLS
          # ============================================================

          def crea_riga(progressivo_lottotools, estrazione):

              if progressivo_lottotools > 9999:
                  raise Exception(
                      "Progressivo LottoTools superiore a 9999. "
                      "Il formato a 4 cifre deve essere aggiornato."
                  )

              riga = (
                  f"{progressivo_lottotools:04d}"
                  + estrazione["data"].strftime("%d-%m-%Y")
              )

              for ruota in estrazione["numeri"]:
                  for numero in ruota:
                      riga += f"{numero:02d}"

              if len(riga) != 124:
                  raise Exception(
                      "Riga generata con lunghezza non valida: "
                      + str(len(riga))
                  )

              return riga


          # ============================================================
          # VALIDAZIONE ARCHIVIO LOTTOOLS
          # ============================================================

          def valida_righe_archivio(righe, descrizione):

              if not righe:
                  raise Exception(
                      descrizione + ": archivio vuoto."
                  )

              progressivo_precedente = None
              data_precedente = None

              for indice, riga in enumerate(
                  righe,
                  start=1
              ):

                  if not riga:
                      raise Exception(
                          f"{descrizione}: riga {indice} vuota."
                      )

                  if riga != riga.strip():
                      raise Exception(
                          f"{descrizione}: riga {indice} "
                          "contiene spazi iniziali o finali."
                      )

                  if len(riga) != 124:
                      raise Exception(
                          f"{descrizione}: riga {indice}: "
                          f"lunghezza {len(riga)}, attesa 124."
                      )

                  if not riga[:4].isdigit():
                      raise Exception(
                          f"{descrizione}: riga {indice}: "
                          "progressivo non valido."
                      )

                  progressivo = int(riga[:4])

                  try:
                      data_riga = datetime.strptime(
                          riga[4:14],
                          "%d-%m-%Y"
                      ).date()
                  except ValueError:
                      raise Exception(
                          f"{descrizione}: riga {indice}: "
                          "data non valida."
                      )

                  dati = riga[14:]

                  if len(dati) != 110:
                      raise Exception(
                          f"{descrizione}: riga {indice}: "
                          "lunghezza dati estrazione non valida."
                      )

                  if not dati.isdigit():
                      raise Exception(
                          f"{descrizione}: riga {indice}: "
                          "estrazione non numerica."
                      )

                  valori = [
                      int(dati[i:i + 2])
                      for i in range(0, 110, 2)
                  ]

                  if len(valori) != 55:
                      raise Exception(
                          f"{descrizione}: riga {indice}: "
                          "numero estratti non valido."
                      )

                  for valore in valori:
                      if valore < 1 or valore > 90:
                          raise Exception(
                              f"{descrizione}: riga {indice}: "
                              "estratto fuori intervallo 1-90."
                          )

                  for r in range(11):
                      ruota = valori[r * 5:(r + 1) * 5]

                      if len(set(ruota)) != 5:
                          raise Exception(
                              f"{descrizione}: riga {indice}: "
                              "estratti duplicati nella stessa ruota."
                          )

                  if progressivo_precedente is not None:

                      if (
                          progressivo
                          != progressivo_precedente + 1
                      ):
                          raise Exception(
                              f"{descrizione}: riga {indice}: "
                              "progressivi non consecutivi."
                          )

                      if data_riga <= data_precedente:
                          raise Exception(
                              f"{descrizione}: riga {indice}: "
                              "date non crescenti."
                          )

                  progressivo_precedente = progressivo
                  data_precedente = data_riga

              return (
                  progressivo_precedente,
                  data_precedente
              )


          # ============================================================
          # 1 - LEGGO E VALIDO AGGARCMOB
          # ============================================================

          archivio = Path("AggArcMob.txt")

          if not archivio.exists():
              raise Exception(
                  "AggArcMob.txt non trovato."
              )

          contenuto_archivio = archivio.read_text(
              encoding="utf-8"
          )

          righe = contenuto_archivio.splitlines()

          ultimo_progressivo, ultima_data = (
              valida_righe_archivio(
                  righe,
                  "Archivio GitHub iniziale"
              )
          )

          print("")
          print("========================================")
          print(" LOTTOOLS - RICERCA ESTRAZIONI MANCANTI")
          print("========================================")
          print(
              "Ultimo archivio GitHub:",
              ultimo_progressivo,
              "-",
              ultima_data.strftime("%d-%m-%Y")
          )


          # ============================================================
          # 2 - RECUPERO ANNUALE E CONFRONTO LOTTO ITALIA
          # ============================================================

          oggi = datetime.now(ZoneInfo("Europe/Rome")).date()
          if ultima_data > oggi:
              raise Exception("AggArcMob.txt contiene una data futura.")

          riferimenti = trova_estrazioni_mancanti(ultima_data, oggi)
          nuove_righe = []
          nuovo_progressivo = ultimo_progressivo

          for estrazione in riferimenti:
              print("Controllo", estrazione["progressivo"], estrazione["data"].strftime("%d/%m/%Y"))
              lotto = scarica_estrazione_lotto_italia(estrazione["data"])
              confronta(estrazione, lotto)
              print("Confronto 55 estratti con Lotto Italia: OK")
              nuovo_progressivo += 1
              nuova_riga = crea_riga(nuovo_progressivo, estrazione)
              nuove_righe.append(nuova_riga)
              print("Nuova riga LottoTools:", nuova_riga)


          # ============================================================
          # 6 - VALIDAZIONE FINALE
          # ============================================================

          print("")
          print("========================================")
          print(" LOTTOOLS - VALIDAZIONE FINALE")
          print("========================================")

          if not nuove_righe:

              print(
                  "Nessuna nuova estrazione da pubblicare."
              )

              print(
                  "AggArcMob.txt non modificato."
              )

          else:

              righe_finali = (
                  righe + nuove_righe
              )

              ultimo_finale, data_finale = (
                  valida_righe_archivio(
                      righe_finali,
                      "Validazione finale"
                  )
              )

              if ultimo_finale != nuovo_progressivo:
                  raise Exception(
                      "Validazione finale: progressivo finale "
                      "non coerente."
                  )

              if data_finale != riferimenti[-1]["data"]:
                  raise Exception(
                      "Validazione finale: data finale "
                      "non coerente."
                  )

              # ========================================================
              # SCRITTURA APPEND-ONLY
              # ========================================================

              with archivio.open(
                  "a",
                  encoding="utf-8",
                  newline=""
              ) as f:

                  for nuova_riga in nuove_righe:
                      f.write(
                          nuova_riga + "\n"
                      )


              # ========================================================
              # RILETTURA REALE DOPO SCRITTURA
              # ========================================================

              contenuto_verifica = archivio.read_text(
                  encoding="utf-8"
              )

              verifica = contenuto_verifica.splitlines()

              ultimo_verifica, data_verifica = (
                  valida_righe_archivio(
                      verifica,
                      "Verifica dopo scrittura"
                  )
              )

              if len(verifica) != len(righe_finali):
                  raise Exception(
                      "Verifica dopo scrittura: "
                      "numero righe errato."
                  )

              if verifica != righe_finali:
                  raise Exception(
                      "Verifica dopo scrittura: "
                      "il contenuto riletto non coincide "
                      "esattamente con quello previsto."
                  )

              if ultimo_verifica != nuovo_progressivo:
                  raise Exception(
                      "Verifica dopo scrittura: "
                      "ultimo progressivo errato."
                  )

              if data_verifica != riferimenti[-1]["data"]:
                  raise Exception(
                      "Verifica dopo scrittura: "
                      "ultima data errata."
                  )

              print(
                  "Archivio completo validato: OK"
              )

              print(
                  "Scrittura locale nel runner: OK"
              )

              print(
                  "Rilettura integrale dopo scrittura: OK"
              )

              print(
                  "Righe totali:",
                  len(verifica)
              )

              print(
                  "Ultima progressiva:",
                  ultimo_verifica
              )

              print(
                  "Ultima data:",
                  data_verifica.strftime("%d-%m-%Y")
              )

              print(
                  "Pronto per la pubblicazione GitHub."
              )
      
      - name: Pubblica archivio aggiornato
        if: github.event_name == 'schedule' || inputs.publish == true
        shell: bash
        run: |
          if git diff --quiet -- AggArcMob.txt; then
            echo "Nessuna modifica da pubblicare."
            exit 0
          fi

          git config user.name "LottoTools Updater"
          git config user.email "actions@github.com"

          git add AggArcMob.txt
          git commit -m "Aggiornamento automatico archivio LottoTools"
          git push

          echo ""
          echo "========================================"
          echo " LOTTOOLS - PUBBLICAZIONE COMPLETATA"
          echo "========================================"
          echo "AggArcMob.txt pubblicato su GitHub."
