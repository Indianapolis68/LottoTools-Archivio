name: Aggiorna archivio LottoTools

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  controllo:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v7

      - name: Cerca e verifica estrazioni mancanti
        shell: python
        run: |
          from pathlib import Path
          from datetime import datetime, date
          from urllib.request import Request, urlopen
          import re
          import json

          # ============================================================
          # COSTANTI
          # ============================================================

          USER_AGENT = "Mozilla/5.0 LottoToolsUpdater/1.0"

          NOMI_RUOTE_ADM = [
              "BARI", "CAGLIARI", "FIRENZE", "GENOVA",
              "MILANO", "NAPOLI", "PALERMO", "ROMA",
              "TORINO", "VENEZIA", "NAZIONALE"
          ]

          ORDINE_LOTTO_ITALIA = [
              "BA", "CA", "FI", "GE", "MI",
              "NA", "PA", "RM", "TO", "VE", "RN"
          ]


          # ============================================================
          # FUNZIONI INTERNET
          # ============================================================

          def scarica_testo(url):
              req = Request(
                  url,
                  headers={"User-Agent": USER_AGENT}
              )

              with urlopen(req, timeout=30) as response:
                  return response.read().decode(
                      "utf-8",
                      errors="replace"
                  )


          def scarica_elenco_mensile_adm(anno, mese):

              url = (
                  "https://www.adm.gov.it/portale/monopoli/giochi/"
                  "gioco-del-lotto/lotto_g/lotto_estr"
                  "?_it_sogei_wda_web_portlet_WebDisplayAamsPortlet_anno="
                  + str(anno)
                  + "&_it_sogei_wda_web_portlet_WebDisplayAamsPortlet_mese="
                  + str(mese)
                  + "&p_p_cacheability=cacheLevelPage"
                  + "&p_p_id=it_sogei_wda_web_portlet_WebDisplayAamsPortlet"
                  + "&p_p_lifecycle=2&p_p_mode=view&p_p_state=normal"
              )

              html = scarica_testo(url)

              # Una risposta completamente vuota è un'anomalia.
              # NON significa archivio aggiornato.
              if not html or not html.strip():
                  raise Exception(
                      "ADM: risposta mensile vuota per "
                      + f"{mese:02d}/{anno}."
                  )

              matches = re.findall(
                  r"N\.(\d+)\s+di\s+.*?(\d{2}/\d{2}/\d{4})",
                  html,
                  re.DOTALL
              )

              risultato = []

              for progressivo, data_txt in matches:
                  risultato.append({
                      "progressivo": int(progressivo),
                      "data": datetime.strptime(
                          data_txt,
                          "%d/%m/%Y"
                      ).date()
                  })

              return risultato


          def scarica_ultimo_riferimento_adm():

              url = (
                  "https://www.adm.gov.it/portale/monopoli/giochi/"
                  "gioco-del-lotto/lotto_g"
                  "?p_p_id=it_sogei_wda_web_portlet_WebDisplayAamsPortlet"
                  "&p_p_lifecycle=2"
                  "&p_p_state=normal"
                  "&p_p_mode=view"
                  "&p_p_cacheability=cacheLevelPage"
              )

              req = Request(
                  url,
                  data=b"",
                  headers={"User-Agent": USER_AGENT},
                  method="POST"
              )

              with urlopen(req, timeout=30) as response:
                  html = response.read().decode(
                      "utf-8",
                      errors="replace"
                  )

              if not html or not html.strip():
                  raise Exception(
                      "ADM: risposta vuota durante la ricerca "
                      "dell'ultima estrazione."
                  )

              titolo = re.search(
                  r"Estrazione\s+n(?:°|&deg;)"
                  r"(?:\s|&nbsp;)*?(\d+)"
                  r"(?:\s|&nbsp;)*del"
                  r"(?:\s|&nbsp;)*"
                  r"(\d{2}/\d{2}/\d{4})",
                  html,
                  re.IGNORECASE
              )

              if not titolo:
                  raise Exception(
                      "ADM: impossibile individuare numero e data "
                      "dell'ultima estrazione."
                  )

              return {
                  "progressivo": int(titolo.group(1)),
                  "data": datetime.strptime(
                      titolo.group(2),
                      "%d/%m/%Y"
                  ).date()
              }


          def scarica_estrazione_adm(anno, progressivo):

              url = (
                  "https://www.adm.gov.it/portale/monopoli/giochi/"
                  "gioco-del-lotto/lotto_g"
                  "?_it_sogei_wda_web_portlet_WebDisplayAamsPortlet_anno="
                  + str(anno)
                  + "&_it_sogei_wda_web_portlet_WebDisplayAamsPortlet_prog="
                  + str(progressivo)
                  + "&p_p_cacheability=cacheLevelPage"
                  + "&p_p_id=it_sogei_wda_web_portlet_WebDisplayAamsPortlet"
                  + "&p_p_lifecycle=2&p_p_mode=view&p_p_state=normal"
              )

              html = scarica_testo(url)

              if not html or not html.strip():
                  raise Exception(
                      "ADM: risposta vuota per progressivo "
                      + str(progressivo)
                      + "."
                  )

              titolo = re.search(
                  r"Estrazione\s+n(?:°|&deg;)"
                  r"(?:\s|&nbsp;)*?(\d+)"
                  r"(?:\s|&nbsp;)*del"
                  r"(?:\s|&nbsp;)*"
                  r"(\d{2}/\d{2}/\d{4})",
                  html,
                  re.IGNORECASE
              )

              if not titolo:
                  raise Exception(
                      "Impossibile leggere progressivo e data ADM."
                  )

              progressivo_trovato = int(titolo.group(1))

              if progressivo_trovato != progressivo:
                  raise Exception(
                      "ADM ha restituito un progressivo diverso. "
                      + "Richiesto "
                      + str(progressivo)
                      + ", ricevuto "
                      + str(progressivo_trovato)
                      + "."
                  )

              data_estrazione = datetime.strptime(
                  titolo.group(2),
                  "%d/%m/%Y"
              ).date()

              if data_estrazione.year != anno:
                  raise Exception(
                      "ADM: anno dell'estrazione non coerente. "
                      + "Anno richiesto "
                      + str(anno)
                      + ", data restituita "
                      + data_estrazione.strftime("%d/%m/%Y")
                      + "."
                  )

              numeri = []

              for nome_ruota in NOMI_RUOTE_ADM:

                  inizio = html.find(
                      ">" + nome_ruota + "</h3>"
                  )

                  if inizio == -1:
                      raise Exception(
                          "Ruota "
                          + nome_ruota
                          + " non trovata."
                      )

                  fine = html.find(
                      "Numero Oro:",
                      inizio
                  )

                  if fine == -1:
                      raise Exception(
                          "Fine dati ruota "
                          + nome_ruota
                          + " non trovata."
                      )

                  blocco = html[inizio:fine]

                  estratti = re.findall(
                      r'<span class="mr-2">(\d{1,2})</span>',
                      blocco
                  )

                  if len(estratti) != 5:
                      raise Exception(
                          "Numero estratti non corretto sulla ruota "
                          + nome_ruota
                          + ". Trovati: "
                          + str(len(estratti))
                      )

                  valori = [int(x) for x in estratti]

                  for valore in valori:
                      if valore < 1 or valore > 90:
                          raise Exception(
                              "Estratto non valido sulla ruota "
                              + nome_ruota
                              + "."
                          )

                  if len(set(valori)) != 5:
                      raise Exception(
                          "ADM: estratti duplicati sulla ruota "
                          + nome_ruota
                          + "."
                      )

                  numeri.append(valori)

              if len(numeri) != 11:
                  raise Exception(
                      "ADM: numero ruote non corretto."
                  )

              return {
                  "progressivo": progressivo_trovato,
                  "data": data_estrazione,
                  "numeri": numeri
              }


          # ============================================================
          # CAMBIO ANNO ADM
          # ============================================================

          def trova_ultimo_riferimento_anno_adm(anno):

              try:
                  elenco_dicembre = scarica_elenco_mensile_adm(
                      anno,
                      12
                  )
              except Exception as ex:
                  raise Exception(
                      "ADM: impossibile individuare l'ultima "
                      "estrazione dell'anno "
                      + str(anno)
                      + ". Elenco di dicembre non disponibile."
                  ) from ex

              if not elenco_dicembre:
                  raise Exception(
                      "ADM: nessuna estrazione trovata per dicembre "
                      + str(anno)
                      + ". Impossibile attraversare il cambio anno."
                  )

              ultimo = max(
                  elenco_dicembre,
                  key=lambda x: x["data"]
              )

              if ultimo["data"].year != anno:
                  raise Exception(
                      "ADM: anno non coerente nell'ultima "
                      "estrazione del "
                      + str(anno)
                      + "."
                  )

              return ultimo


          def ricostruisci_riferimenti_adm(
              ultima_data_locale,
              ultimo_rif_adm
          ):

              risultato = []

              anno_adm = ultimo_rif_adm["data"].year
              progressivo_adm = ultimo_rif_adm["progressivo"]

              while True:

                  if progressivo_adm < 1:

                      anno_adm -= 1

                      ultimo_anno_precedente = (
                          trova_ultimo_riferimento_anno_adm(
                              anno_adm
                          )
                      )

                      progressivo_adm = (
                          ultimo_anno_precedente["progressivo"]
                      )

                  estr_adm = scarica_estrazione_adm(
                      anno_adm,
                      progressivo_adm
                  )

                  if estr_adm["data"].year != anno_adm:
                      raise Exception(
                          "ADM: anno dell'estrazione "
                          "non coerente."
                      )

                  if estr_adm["data"] <= ultima_data_locale:

                      if estr_adm["data"] != ultima_data_locale:
                          raise Exception(
                              "ADM: anomalia nella sequenza "
                              "delle estrazioni. "
                              + "Ultima data archivio GitHub: "
                              + ultima_data_locale.strftime(
                                  "%d/%m/%Y"
                              )
                              + " - Data ADM raggiunta: "
                              + estr_adm["data"].strftime(
                                  "%d/%m/%Y"
                              )
                          )

                      break

                  risultato.append({
                      "progressivo": estr_adm["progressivo"],
                      "data": estr_adm["data"]
                  })

                  progressivo_adm -= 1

              risultato.sort(
                  key=lambda x: x["data"]
              )

              return risultato


          # ============================================================
          # LOTTO ITALIA
          # ============================================================

          def scarica_estrazione_lotto_italia(data_estrazione):

              url = (
                  "https://www.lotto-italia.it/gdl/"
                  "estrazioni-e-vincite/"
                  "estrazioni-del-lotto.json"
              )

              corpo = json.dumps({
                  "data": data_estrazione.strftime("%Y%m%d")
              }).encode("utf-8")

              req = Request(
                  url,
                  data=corpo,
                  headers={
                      "User-Agent": USER_AGENT,
                      "Content-Type": "application/json"
                  },
                  method="POST"
              )

              with urlopen(req, timeout=30) as response:
                  dati = json.loads(
                      response.read().decode("utf-8")
                  )

              if "esito" not in dati:
                  raise Exception(
                      "Lotto Italia: campo esito mancante."
                  )

              if str(dati["esito"]).upper() != "OK":
                  raise Exception(
                      "Lotto Italia non ha reso disponibile "
                      "l'estrazione del "
                      + data_estrazione.strftime("%d/%m/%Y")
                  )

              if "estrazione" not in dati:
                  raise Exception(
                      "Lotto Italia: estrazione mancante."
                  )

              elenco = dati["estrazione"]

              if len(elenco) != 11:
                  raise Exception(
                      "Numero ruote Lotto Italia non corretto."
                  )

              numeri = []

              for indice, ruota in enumerate(elenco):

                  if "ruota" not in ruota:
                      raise Exception(
                          "Lotto Italia: sigla ruota mancante."
                      )

                  if "numeri" not in ruota:
                      raise Exception(
                          "Lotto Italia: numeri ruota mancanti."
                      )

                  sigla = str(
                      ruota["ruota"]
                  ).upper()

                  if sigla != ORDINE_LOTTO_ITALIA[indice]:
                      raise Exception(
                          "Ordine ruote Lotto Italia non corretto. "
                          + "Attesa "
                          + ORDINE_LOTTO_ITALIA[indice]
                          + ", trovata "
                          + sigla
                      )

                  valori = [
                      int(x)
                      for x in ruota["numeri"]
                  ]

                  if len(valori) != 5:
                      raise Exception(
                          "Numero estratti Lotto Italia "
                          "non corretto."
                      )

                  for valore in valori:
                      if valore < 1 or valore > 90:
                          raise Exception(
                              "Estratto Lotto Italia non valido."
                          )

                  if len(set(valori)) != 5:
                      raise Exception(
                          "Lotto Italia: estratti duplicati "
                          "sulla ruota "
                          + sigla
                          + "."
                      )

                  numeri.append(valori)

              return {
                  "data": data_estrazione,
                  "numeri": numeri
              }


          def confronta(adm, lotto):

              if adm["data"] != lotto["data"]:
                  raise Exception(
                      "Data ADM e Lotto Italia non coincidente."
                  )

              nomi = [
                  "Ba", "Ca", "Fi", "Ge", "Mi",
                  "Na", "Pa", "Ro", "To", "Ve", "Nz"
              ]

              for r in range(11):
                  for n in range(5):

                      if (
                          adm["numeri"][r][n]
                          != lotto["numeri"][r][n]
                      ):
                          raise Exception(
                              "Controllo incrociato fallito - "
                              + adm["data"].strftime("%d/%m/%Y")
                              + " - Ruota "
                              + nomi[r]
                              + " - "
                              + str(n + 1)
                              + "° estratto. ADM="
                              + str(adm["numeri"][r][n])
                              + " LottoItalia="
                              + str(lotto["numeri"][r][n])
                          )


          # ============================================================
          # CREAZIONE RIGA LOTTOOLS
          # ============================================================

          def crea_riga(progressivo_lottotools, estrazione):

              if progressivo_lottotools > 9999:
                  raise Exception(
                      "Progressivo LottoTools superiore a 9999. "
                      "Il formato a 4 cifre deve essere aggiornato."
                  )

              riga = (
                  f"{progressivo_lottotools:04d}"
                  + estrazione["data"].strftime("%d-%m-%Y")
              )

              for ruota in estrazione["numeri"]:
                  for numero in ruota:
                      riga += f"{numero:02d}"

              if len(riga) != 124:
                  raise Exception(
                      "Riga generata con lunghezza non valida: "
                      + str(len(riga))
                  )

              return riga


          # ============================================================
          # VALIDAZIONE ARCHIVIO LOTTOOLS
          # ============================================================

          def valida_righe_archivio(righe, descrizione):

              if not righe:
                  raise Exception(
                      descrizione + ": archivio vuoto."
                  )

              progressivo_precedente = None
              data_precedente = None

              for indice, riga in enumerate(
                  righe,
                  start=1
              ):

                  if not riga:
                      raise Exception(
                          f"{descrizione}: riga {indice} vuota."
                      )

                  if riga != riga.strip():
                      raise Exception(
                          f"{descrizione}: riga {indice} "
                          "contiene spazi iniziali o finali."
                      )

                  if len(riga) != 124:
                      raise Exception(
                          f"{descrizione}: riga {indice}: "
                          f"lunghezza {len(riga)}, attesa 124."
                      )

                  if not riga[:4].isdigit():
                      raise Exception(
                          f"{descrizione}: riga {indice}: "
                          "progressivo non valido."
                      )

                  progressivo = int(riga[:4])

                  try:
                      data_riga = datetime.strptime(
                          riga[4:14],
                          "%d-%m-%Y"
                      ).date()
                  except ValueError:
                      raise Exception(
                          f"{descrizione}: riga {indice}: "
                          "data non valida."
                      )

                  dati = riga[14:]

                  if len(dati) != 110:
                      raise Exception(
                          f"{descrizione}: riga {indice}: "
                          "lunghezza dati estrazione non valida."
                      )

                  if not dati.isdigit():
                      raise Exception(
                          f"{descrizione}: riga {indice}: "
                          "estrazione non numerica."
                      )

                  valori = [
                      int(dati[i:i + 2])
                      for i in range(0, 110, 2)
                  ]

                  if len(valori) != 55:
                      raise Exception(
                          f"{descrizione}: riga {indice}: "
                          "numero estratti non valido."
                      )

                  for valore in valori:
                      if valore < 1 or valore > 90:
                          raise Exception(
                              f"{descrizione}: riga {indice}: "
                              "estratto fuori intervallo 1-90."
                          )

                  for r in range(11):
                      ruota = valori[r * 5:(r + 1) * 5]

                      if len(set(ruota)) != 5:
                          raise Exception(
                              f"{descrizione}: riga {indice}: "
                              "estratti duplicati nella stessa ruota."
                          )

                  if progressivo_precedente is not None:

                      if (
                          progressivo
                          != progressivo_precedente + 1
                      ):
                          raise Exception(
                              f"{descrizione}: riga {indice}: "
                              "progressivi non consecutivi."
                          )

                      if data_riga <= data_precedente:
                          raise Exception(
                              f"{descrizione}: riga {indice}: "
                              "date non crescenti."
                          )

                  progressivo_precedente = progressivo
                  data_precedente = data_riga

              return (
                  progressivo_precedente,
                  data_precedente
              )


          # ============================================================
          # 1 - LEGGO E VALIDO AGGARCMOB
          # ============================================================

          archivio = Path("AggArcMob.txt")

          if not archivio.exists():
              raise Exception(
                  "AggArcMob.txt non trovato."
              )

          contenuto_archivio = archivio.read_text(
              encoding="utf-8"
          )

          righe = contenuto_archivio.splitlines()

          ultimo_progressivo, ultima_data = (
              valida_righe_archivio(
                  righe,
                  "Archivio GitHub iniziale"
              )
          )

          print("")
          print("========================================")
          print(" LOTTOOLS - RICERCA ESTRAZIONI MANCANTI")
          print("========================================")
          print(
              "Ultimo archivio GitHub:",
              ultimo_progressivo,
              "-",
              ultima_data.strftime("%d-%m-%Y")
          )


          # ============================================================
          # 2 - CONTROLLO MENSILE ADM
          # ============================================================

          oggi = date.today()

          if ultima_data > oggi:
              raise Exception(
                  "AggArcMob.txt contiene una data futura: "
                  + ultima_data.strftime("%d/%m/%Y")
              )

          anno = ultima_data.year
          mese = ultima_data.month

          riferimenti_mensili = []

          while True:

              try:
                  elenco = scarica_elenco_mensile_adm(
                      anno,
                      mese
                  )

                  print(
                      "ADM mensile "
                      + f"{mese:02d}/{anno}: "
                      + str(len(elenco))
                      + " riferimenti."
                  )

                  for rif in elenco:

                      if (
                          rif["data"] > ultima_data
                          and rif["data"] <= oggi
                      ):

                          if not any(
                              x["data"] == rif["data"]
                              for x in riferimenti_mensili
                          ):
                              riferimenti_mensili.append(rif)

              except Exception as ex:

                  # Il mensile non decide MAI da solo
                  # che l'archivio sia aggiornato.
                  print(
                      "ATTENZIONE: elenco mensile ADM "
                      + f"{mese:02d}/{anno} non disponibile."
                  )
                  print(
                      "Motivo:",
                      str(ex)
                  )
                  print(
                      "Proseguo con il controllo "
                      "indipendente dell'ultima estrazione ADM."
                  )

              if (
                  anno == oggi.year
                  and mese == oggi.month
              ):
                  break

              mese += 1

              if mese > 12:
                  mese = 1
                  anno += 1


          # ============================================================
          # 3 - CONTROLLO INDIPENDENTE ULTIMA ESTRAZIONE ADM
          # ============================================================

          ultimo_rif_adm = (
              scarica_ultimo_riferimento_adm()
          )

          print("")
          print(
              "Ultima estrazione ADM:",
              ultimo_rif_adm["progressivo"],
              "-",
              ultimo_rif_adm["data"].strftime("%d/%m/%Y")
          )

          if ultimo_rif_adm["data"] > oggi:
              raise Exception(
                  "ADM: ultima estrazione con data futura: "
                  + ultimo_rif_adm["data"].strftime("%d/%m/%Y")
              )

          riferimenti = []

          if ultimo_rif_adm["data"] > ultima_data:

              riferimenti = ricostruisci_riferimenti_adm(
                  ultima_data,
                  ultimo_rif_adm
              )

          elif ultimo_rif_adm["data"] == ultima_data:

              riferimenti = []

          else:

              raise Exception(
                  "ADM risulta più indietro dell'archivio GitHub. "
                  + "Ultima data GitHub: "
                  + ultima_data.strftime("%d/%m/%Y")
                  + " - Ultima data ADM: "
                  + ultimo_rif_adm["data"].strftime("%d/%m/%Y")
                  + ". Nessuna modifica eseguita."
              )


          # ============================================================
          # 4 - CONFRONTO RIFERIMENTI MENSILI / RICOSTRUITI
          # ============================================================

          riferimenti.sort(
              key=lambda x: x["data"]
          )

          riferimenti_mensili.sort(
              key=lambda x: x["data"]
          )

          print("")
          print(
              "Riferimenti trovati dal mensile ADM:",
              len(riferimenti_mensili)
          )

          print(
              "Riferimenti ricostruiti dal controllo indipendente:",
              len(riferimenti)
          )

          # Se il mensile ha fornito riferimenti, le date che
          # compaiono in entrambe le fonti devono avere lo stesso
          # progressivo ADM.
          mensili_per_data = {
              x["data"]: x["progressivo"]
              for x in riferimenti_mensili
          }

          for rif in riferimenti:

              if rif["data"] in mensili_per_data:

                  if (
                      mensili_per_data[rif["data"]]
                      != rif["progressivo"]
                  ):
                      raise Exception(
                          "ADM: discordanza tra elenco mensile "
                          "e ricostruzione indipendente per "
                          + rif["data"].strftime("%d/%m/%Y")
                          + "."
                      )

          print(
              "Estrazioni mancanti definitive:",
              len(riferimenti)
          )


          # ============================================================
          # 5 - ADM + LOTTO ITALIA + CONFRONTO
          # ============================================================

          nuove_righe = []
          nuovo_progressivo = ultimo_progressivo

          for rif in riferimenti:

              print("")
              print(
                  "Controllo ADM",
                  rif["progressivo"],
                  rif["data"].strftime("%d/%m/%Y")
              )

              adm = scarica_estrazione_adm(
                  rif["data"].year,
                  rif["progressivo"]
              )

              if adm["data"] != rif["data"]:
                  raise Exception(
                      "La data del dettaglio ADM non coincide "
                      "con il riferimento ricostruito."
                  )

              print("ADM: OK")

              lotto = scarica_estrazione_lotto_italia(
                  adm["data"]
              )

              print("Lotto Italia: OK")

              confronta(
                  adm,
                  lotto
              )

              print(
                  "Confronto 55 estratti: OK"
              )

              nuovo_progressivo += 1

              riga = crea_riga(
                  nuovo_progressivo,
                  adm
              )

              nuove_righe.append(
                  riga
              )

              print(
                  "Nuova riga LottoTools:",
                  riga
              )


          # ============================================================
          # 6 - VALIDAZIONE FINALE
          # ============================================================

          print("")
          print("========================================")
          print(" LOTTOOLS - VALIDAZIONE FINALE")
          print("========================================")

          if not nuove_righe:

              print(
                  "Nessuna nuova estrazione da pubblicare."
              )

              print(
                  "AggArcMob.txt non modificato."
              )

          else:

              righe_finali = (
                  righe + nuove_righe
              )

              ultimo_finale, data_finale = (
                  valida_righe_archivio(
                      righe_finali,
                      "Validazione finale"
                  )
              )

              if ultimo_finale != nuovo_progressivo:
                  raise Exception(
                      "Validazione finale: progressivo finale "
                      "non coerente."
                  )

              if data_finale != riferimenti[-1]["data"]:
                  raise Exception(
                      "Validazione finale: data finale "
                      "non coerente."
                  )

              # ========================================================
              # SCRITTURA APPEND-ONLY
              # ========================================================

              with archivio.open(
                  "a",
                  encoding="utf-8",
                  newline=""
              ) as f:

                  for nuova_riga in nuove_righe:
                      f.write(
                          nuova_riga + "\n"
                      )


              # ========================================================
              # RILETTURA REALE DOPO SCRITTURA
              # ========================================================

              contenuto_verifica = archivio.read_text(
                  encoding="utf-8"
              )

              verifica = contenuto_verifica.splitlines()

              ultimo_verifica, data_verifica = (
                  valida_righe_archivio(
                      verifica,
                      "Verifica dopo scrittura"
                  )
              )

              if len(verifica) != len(righe_finali):
                  raise Exception(
                      "Verifica dopo scrittura: "
                      "numero righe errato."
                  )

              if verifica != righe_finali:
                  raise Exception(
                      "Verifica dopo scrittura: "
                      "il contenuto riletto non coincide "
                      "esattamente con quello previsto."
                  )

              if ultimo_verifica != nuovo_progressivo:
                  raise Exception(
                      "Verifica dopo scrittura: "
                      "ultimo progressivo errato."
                  )

              if data_verifica != riferimenti[-1]["data"]:
                  raise Exception(
                      "Verifica dopo scrittura: "
                      "ultima data errata."
                  )

              print(
                  "Archivio completo validato: OK"
              )

              print(
                  "Scrittura locale nel runner: OK"
              )

              print(
                  "Rilettura integrale dopo scrittura: OK"
              )

              print(
                  "Righe totali:",
                  len(verifica)
              )

              print(
                  "Ultima progressiva:",
                  ultimo_verifica
              )

              print(
                  "Ultima data:",
                  data_verifica.strftime("%d-%m-%Y")
              )

              print(
                  "Pronto per la pubblicazione GitHub."
              )


      - name: Pubblica archivio aggiornato
        shell: bash
        run: |
          if git diff --quiet -- AggArcMob.txt; then
            echo "Nessuna modifica da pubblicare."
            exit 0
          fi

          git config user.name "LottoTools Updater"
          git config user.email "actions@github.com"

          git add AggArcMob.txt
          git commit -m "Aggiornamento automatico archivio LottoTools"
          git push

          echo ""
          echo "========================================"
          echo " LOTTOOLS - PUBBLICAZIONE COMPLETATA"
          echo "========================================"
          echo "AggArcMob.txt pubblicato su GitHub."
