name: TEST Cambio Anno ADM LottoTools

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-cambio-anno:
    runs-on: ubuntu-latest

    steps:
      - name: Test ricostruzione ADM 2025-2026
        shell: python
        run: |
          from datetime import datetime
          from urllib.request import Request, urlopen
          import re

          USER_AGENT = "Mozilla/5.0 LottoToolsUpdater/1.0"

          NOMI_RUOTE_ADM = [
              "BARI", "CAGLIARI", "FIRENZE", "GENOVA",
              "MILANO", "NAPOLI", "PALERMO", "ROMA",
              "TORINO", "VENEZIA", "NAZIONALE"
          ]


          # ============================================================
          # FUNZIONE GET
          # ============================================================

          def scarica_testo(url):

              req = Request(
                  url,
                  headers={"User-Agent": USER_AGENT}
              )

              with urlopen(req, timeout=30) as response:
                  return response.read().decode(
                      "utf-8",
                      errors="replace"
                  )


          # ============================================================
          # ELENCO MENSILE ADM
          # Usato SOLO per individuare il vero ultimo progressivo
          # dell'anno precedente durante il cambio anno.
          # ============================================================

          def scarica_elenco_mensile_adm(anno, mese):

              url = (
                  "https://www.adm.gov.it/portale/monopoli/giochi/"
                  "gioco-del-lotto/lotto_g/lotto_estr"
                  "?_it_sogei_wda_web_portlet_WebDisplayAamsPortlet_anno="
                  + str(anno)
                  + "&_it_sogei_wda_web_portlet_WebDisplayAamsPortlet_mese="
                  + str(mese)
                  + "&p_p_cacheability=cacheLevelPage"
                  + "&p_p_id=it_sogei_wda_web_portlet_WebDisplayAamsPortlet"
                  + "&p_p_lifecycle=2&p_p_mode=view&p_p_state=normal"
              )

              html = scarica_testo(url)

              if not html or not html.strip():
                  raise Exception(
                      "ADM: risposta mensile vuota per "
                      + f"{mese:02d}/{anno}."
                  )

              matches = re.findall(
                  r"N\.(\d+)\s+di\s+.*?(\d{2}/\d{2}/\d{4})",
                  html,
                  re.DOTALL
              )

              risultato = []

              for progressivo, data_txt in matches:

                  risultato.append({
                      "progressivo": int(progressivo),
                      "data": datetime.strptime(
                          data_txt,
                          "%d/%m/%Y"
                      ).date()
                  })

              return risultato


          # ============================================================
          # POST INDIPENDENTE - ULTIMA ESTRAZIONE ADM
          # ============================================================

          def scarica_ultimo_riferimento_adm():

              url = (
                  "https://www.adm.gov.it/portale/monopoli/giochi/"
                  "gioco-del-lotto/lotto_g"
                  "?p_p_id=it_sogei_wda_web_portlet_WebDisplayAamsPortlet"
                  "&p_p_lifecycle=2"
                  "&p_p_state=normal"
                  "&p_p_mode=view"
                  "&p_p_cacheability=cacheLevelPage"
              )

              req = Request(
                  url,
                  data=b"",
                  headers={"User-Agent": USER_AGENT},
                  method="POST"
              )

              with urlopen(req, timeout=30) as response:

                  html = response.read().decode(
                      "utf-8",
                      errors="replace"
                  )

              if not html or not html.strip():
                  raise Exception(
                      "ADM: risposta POST vuota."
                  )

              titolo = re.search(
                  r"Estrazione\s+n(?:°|&deg;)"
                  r"(?:\s|&nbsp;)*?(\d+)"
                  r"(?:\s|&nbsp;)*del"
                  r"(?:\s|&nbsp;)*"
                  r"(\d{2}/\d{2}/\d{4})",
                  html,
                  re.IGNORECASE
              )

              if not titolo:
                  raise Exception(
                      "ADM: impossibile individuare "
                      "l'ultima estrazione."
                  )

              return {
                  "progressivo": int(titolo.group(1)),
                  "data": datetime.strptime(
                      titolo.group(2),
                      "%d/%m/%Y"
                  ).date()
              }


          # ============================================================
          # DETTAGLIO ESTRAZIONE ADM
          # ============================================================

          def scarica_estrazione_adm(anno, progressivo):

              url = (
                  "https://www.adm.gov.it/portale/monopoli/giochi/"
                  "gioco-del-lotto/lotto_g"
                  "?_it_sogei_wda_web_portlet_WebDisplayAamsPortlet_anno="
                  + str(anno)
                  + "&_it_sogei_wda_web_portlet_WebDisplayAamsPortlet_prog="
                  + str(progressivo)
                  + "&p_p_cacheability=cacheLevelPage"
                  + "&p_p_id=it_sogei_wda_web_portlet_WebDisplayAamsPortlet"
                  + "&p_p_lifecycle=2&p_p_mode=view&p_p_state=normal"
              )

              html = scarica_testo(url)

              if not html or not html.strip():
                  raise Exception(
                      "ADM: risposta dettaglio vuota. "
                      + "Anno "
                      + str(anno)
                      + ", progressivo "
                      + str(progressivo)
                      + "."
                  )

              titolo = re.search(
                  r"Estrazione\s+n(?:°|&deg;)"
                  r"(?:\s|&nbsp;)*?(\d+)"
                  r"(?:\s|&nbsp;)*del"
                  r"(?:\s|&nbsp;)*"
                  r"(\d{2}/\d{2}/\d{4})",
                  html,
                  re.IGNORECASE
              )

              if not titolo:
                  raise Exception(
                      "ADM: titolo estrazione non trovato. "
                      + "Anno "
                      + str(anno)
                      + ", progressivo "
                      + str(progressivo)
                      + "."
                  )

              progressivo_trovato = int(
                  titolo.group(1)
              )

              if progressivo_trovato != progressivo:
                  raise Exception(
                      "ADM: progressivo restituito diverso. "
                      + "Richiesto "
                      + str(progressivo)
                      + ", trovato "
                      + str(progressivo_trovato)
                      + "."
                  )

              data_estrazione = datetime.strptime(
                  titolo.group(2),
                  "%d/%m/%Y"
              ).date()

              if data_estrazione.year != anno:
                  raise Exception(
                      "ADM: anno restituito non coerente. "
                      + "Anno richiesto "
                      + str(anno)
                      + ", data "
                      + data_estrazione.strftime("%d/%m/%Y")
                      + "."
                  )

              numeri = []

              for nome_ruota in NOMI_RUOTE_ADM:

                  inizio = html.find(
                      ">" + nome_ruota + "</h3>"
                  )

                  if inizio == -1:
                      raise Exception(
                          "ADM: ruota "
                          + nome_ruota
                          + " non trovata."
                      )

                  fine = html.find(
                      "Numero Oro:",
                      inizio
                  )

                  if fine == -1:
                      raise Exception(
                          "ADM: fine dati ruota "
                          + nome_ruota
                          + " non trovata."
                      )

                  blocco = html[inizio:fine]

                  estratti = re.findall(
                      r'<span class="mr-2">(\d{1,2})</span>',
                      blocco
                  )

                  if len(estratti) != 5:
                      raise Exception(
                          "ADM: numero estratti non corretto "
                          "sulla ruota "
                          + nome_ruota
                          + "."
                      )

                  valori = [
                      int(x)
                      for x in estratti
                  ]

                  for valore in valori:

                      if valore < 1 or valore > 90:
                          raise Exception(
                              "ADM: estratto fuori intervallo."
                          )

                  if len(set(valori)) != 5:
                      raise Exception(
                          "ADM: estratti duplicati sulla ruota "
                          + nome_ruota
                          + "."
                      )

                  numeri.append(valori)

              if len(numeri) != 11:
                  raise Exception(
                      "ADM: numero ruote non corretto."
                  )

              return {
                  "progressivo": progressivo_trovato,
                  "data": data_estrazione,
                  "numeri": numeri
              }


          # ============================================================
          # TROVA ULTIMA ESTRAZIONE DELL'ANNO PRECEDENTE
          # ============================================================

          def trova_ultimo_riferimento_anno_adm(anno):

              print("")
              print(
                  "CAMBIO ANNO: cerco l'ultima estrazione ADM del",
                  anno
              )

              try:

                  elenco_dicembre = (
                      scarica_elenco_mensile_adm(
                          anno,
                          12
                      )
                  )

              except Exception as ex:

                  raise Exception(
                      "ADM: impossibile individuare "
                      "l'ultima estrazione dell'anno "
                      + str(anno)
                      + ". Elenco dicembre non disponibile."
                  ) from ex

              if not elenco_dicembre:
                  raise Exception(
                      "ADM: nessuna estrazione trovata "
                      "in dicembre "
                      + str(anno)
                      + "."
                  )

              ultimo = max(
                  elenco_dicembre,
                  key=lambda x: x["data"]
              )

              if ultimo["data"].year != anno:
                  raise Exception(
                      "ADM: anno non coerente "
                      "nell'ultima estrazione del "
                      + str(anno)
                      + "."
                  )

              print(
                  "Ultima estrazione ADM",
                  anno,
                  ":",
                  ultimo["progressivo"],
                  "-",
                  ultimo["data"].strftime("%d/%m/%Y")
              )

              return ultimo


          # ============================================================
          # INIZIO TEST
          # ============================================================

          print("")
          print("========================================")
          print(" LOTTOOLS - TEST CAMBIO ANNO ADM")
          print("========================================")
          print("")
          print(
              "Questo workflow NON modifica AggArcMob.txt."
          )
          print(
              "Nessun commit verrà eseguito."
          )
          print("")

          # Stessa data usata nel grande collaudo VB.NET.
          ultima_data_test = datetime.strptime(
              "23/12/2025",
              "%d/%m/%Y"
          ).date()

          print(
              "Archivio simulato fermo al:",
              ultima_data_test.strftime("%d/%m/%Y")
          )

          print("")
          print(
              "Cerco l'ultima estrazione ADM "
              "tramite POST indipendente..."
          )


          # ============================================================
          # ULTIMA ESTRAZIONE ATTUALE
          # ============================================================

          ultimo = scarica_ultimo_riferimento_adm()

          print(
              "Ultima estrazione ADM:",
              ultimo["progressivo"],
              "-",
              ultimo["data"].strftime("%d/%m/%Y")
          )

          if ultimo["data"] <= ultima_data_test:
              raise Exception(
                  "TEST non valido: ADM non contiene "
                  "estrazioni successive alla data simulata."
              )


          # ============================================================
          # RICOSTRUZIONE
          # ============================================================

          anno_adm = ultimo["data"].year
          progressivo_adm = ultimo["progressivo"]

          riferimenti = []

          cambio_anno_eseguito = False

          print("")
          print(
              "Inizio ricostruzione all'indietro..."
          )
          print("")

          while True:

              if progressivo_adm < 1:

                  anno_adm -= 1

                  print("")
                  print("========================================")
                  print(
                      " RAGGIUNTO CAMBIO ANNO ->",
                      anno_adm
                  )
                  print("========================================")

                  ultimo_anno_precedente = (
                      trova_ultimo_riferimento_anno_adm(
                          anno_adm
                      )
                  )

                  progressivo_adm = (
                      ultimo_anno_precedente["progressivo"]
                  )

                  cambio_anno_eseguito = True

              estrazione = scarica_estrazione_adm(
                  anno_adm,
                  progressivo_adm
              )

              print(
                  "ADM",
                  estrazione["progressivo"],
                  "-",
                  estrazione["data"].strftime("%d/%m/%Y"),
                  "- OK"
              )

              if estrazione["data"] <= ultima_data_test:

                  if estrazione["data"] != ultima_data_test:

                      raise Exception(
                          "TEST FALLITO: aggancio non esatto. "
                          + "Data archivio simulata "
                          + ultima_data_test.strftime(
                              "%d/%m/%Y"
                          )
                          + ", data ADM raggiunta "
                          + estrazione["data"].strftime(
                              "%d/%m/%Y"
                          )
                          + "."
                      )

                  print("")
                  print(
                      "AGGANCIO ESATTO AL 23/12/2025: OK"
                  )

                  break

              riferimenti.append({
                  "progressivo": estrazione["progressivo"],
                  "data": estrazione["data"]
              })

              progressivo_adm -= 1


          # ============================================================
          # CONTROLLI FINALI
          # ============================================================

          if not cambio_anno_eseguito:
              raise Exception(
                  "TEST FALLITO: il cambio anno "
                  "non è stato attraversato."
              )

          riferimenti.sort(
              key=lambda x: x["data"]
          )

          if not riferimenti:
              raise Exception(
                  "TEST FALLITO: nessuna estrazione ricostruita."
              )

          # Le date devono essere strettamente crescenti.
          data_precedente = ultima_data_test

          for rif in riferimenti:

              if rif["data"] <= data_precedente:
                  raise Exception(
                      "TEST FALLITO: sequenza date "
                      "non strettamente crescente."
                  )

              data_precedente = rif["data"]

          if riferimenti[-1]["data"] != ultimo["data"]:
              raise Exception(
                  "TEST FALLITO: l'ultima data ricostruita "
                  "non coincide con l'ultima ADM."
              )

          if (
              riferimenti[-1]["progressivo"]
              != ultimo["progressivo"]
          ):
              raise Exception(
                  "TEST FALLITO: l'ultimo progressivo "
                  "ricostruito non coincide con l'ultima ADM."
              )


          # ============================================================
          # RISULTATO
          # ============================================================

          print("")
          print("========================================")
          print(" TEST CAMBIO ANNO SUPERATO!")
          print("========================================")
          print("")
          print(
              "Cambio anno attraversato: OK"
          )
          print(
              "Aggancio esatto al 23/12/2025: OK"
          )
          print(
              "Sequenza cronologica ricostruita: OK"
          )
          print(
              "Ultima estrazione raggiunta:",
              riferimenti[-1]["progressivo"],
              "-",
              riferimenti[-1]["data"].strftime("%d/%m/%Y")
          )
          print(
              "Estrazioni mancanti ricostruite:",
              len(riferimenti)
          )
          print("")
          print(
              "AggArcMob.txt NON modificato."
          )
          print(
              "Nessun commit eseguito."
          )
