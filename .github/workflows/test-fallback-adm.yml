name: TEST Cambio Anno ADM LottoTools

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-cambio-anno:
    runs-on: ubuntu-latest

    steps:
      - name: Test progressivi date e cambio anno ADM
        shell: python
        run: |
          from datetime import datetime
          from urllib.request import Request, urlopen
          import re

          USER_AGENT = "Mozilla/5.0 LottoToolsUpdater/1.0"

          NOMI_RUOTE_ADM = [
              "BARI", "CAGLIARI", "FIRENZE", "GENOVA",
              "MILANO", "NAPOLI", "PALERMO", "ROMA",
              "TORINO", "VENEZIA", "NAZIONALE"
          ]


          # ============================================================
          # GET
          # ============================================================

          def scarica_testo(url):

              req = Request(
                  url,
                  headers={"User-Agent": USER_AGENT}
              )

              with urlopen(req, timeout=30) as response:
                  return response.read().decode(
                      "utf-8",
                      errors="replace"
                  )


          # ============================================================
          # ELENCO MENSILE ADM
          # Usato SOLO al cambio anno per trovare il vero ultimo
          # progressivo ADM dell'anno precedente.
          # ============================================================

          def scarica_elenco_mensile_adm(anno, mese):

              url = (
                  "https://www.adm.gov.it/portale/monopoli/giochi/"
                  "gioco-del-lotto/lotto_g/lotto_estr"
                  "?_it_sogei_wda_web_portlet_WebDisplayAamsPortlet_anno="
                  + str(anno)
                  + "&_it_sogei_wda_web_portlet_WebDisplayAamsPortlet_mese="
                  + str(mese)
                  + "&p_p_cacheability=cacheLevelPage"
                  + "&p_p_id=it_sogei_wda_web_portlet_WebDisplayAamsPortlet"
                  + "&p_p_lifecycle=2&p_p_mode=view&p_p_state=normal"
              )

              html = scarica_testo(url)

              if not html or not html.strip():
                  raise Exception(
                      "ADM: risposta mensile vuota per "
                      + f"{mese:02d}/{anno}."
                  )

              matches = re.findall(
                  r"N\.(\d+)\s+di\s+.*?(\d{2}/\d{2}/\d{4})",
                  html,
                  re.DOTALL
              )

              risultato = []

              for progressivo, data_txt in matches:

                  risultato.append({
                      "progressivo": int(progressivo),
                      "data": datetime.strptime(
                          data_txt,
                          "%d/%m/%Y"
                      ).date()
                  })

              return risultato


          # ============================================================
          # POST INDIPENDENTE - ULTIMA ESTRAZIONE ADM
          # ============================================================

          def scarica_ultimo_riferimento_adm():

              url = (
                  "https://www.adm.gov.it/portale/monopoli/giochi/"
                  "gioco-del-lotto/lotto_g"
                  "?p_p_id=it_sogei_wda_web_portlet_WebDisplayAamsPortlet"
                  "&p_p_lifecycle=2"
                  "&p_p_state=normal"
                  "&p_p_mode=view"
                  "&p_p_cacheability=cacheLevelPage"
              )

              req = Request(
                  url,
                  data=b"",
                  headers={"User-Agent": USER_AGENT},
                  method="POST"
              )

              with urlopen(req, timeout=30) as response:
                  html = response.read().decode(
                      "utf-8",
                      errors="replace"
                  )

              if not html or not html.strip():
                  raise Exception(
                      "ADM: risposta POST vuota."
                  )

              titolo = re.search(
                  r"Estrazione\s+n(?:°|&deg;)"
                  r"(?:\s|&nbsp;)*?(\d+)"
                  r"(?:\s|&nbsp;)*del"
                  r"(?:\s|&nbsp;)*"
                  r"(\d{2}/\d{2}/\d{4})",
                  html,
                  re.IGNORECASE
              )

              if not titolo:
                  raise Exception(
                      "ADM: impossibile individuare "
                      "l'ultima estrazione."
                  )

              return {
                  "progressivo": int(titolo.group(1)),
                  "data": datetime.strptime(
                      titolo.group(2),
                      "%d/%m/%Y"
                  ).date()
              }


          # ============================================================
          # DETTAGLIO ESTRAZIONE ADM
          # ============================================================

          def scarica_estrazione_adm(anno, progressivo):

              url = (
                  "https://www.adm.gov.it/portale/monopoli/giochi/"
                  "gioco-del-lotto/lotto_g"
                  "?_it_sogei_wda_web_portlet_WebDisplayAamsPortlet_anno="
                  + str(anno)
                  + "&_it_sogei_wda_web_portlet_WebDisplayAamsPortlet_prog="
                  + str(progressivo)
                  + "&p_p_cacheability=cacheLevelPage"
                  + "&p_p_id=it_sogei_wda_web_portlet_WebDisplayAamsPortlet"
                  + "&p_p_lifecycle=2&p_p_mode=view&p_p_state=normal"
              )

              html = scarica_testo(url)

              if not html or not html.strip():
                  raise Exception(
                      "ADM: risposta dettaglio vuota. "
                      + "Anno "
                      + str(anno)
                      + ", progressivo "
                      + str(progressivo)
                      + "."
                  )

              titolo = re.search(
                  r"Estrazione\s+n(?:°|&deg;)"
                  r"(?:\s|&nbsp;)*?(\d+)"
                  r"(?:\s|&nbsp;)*del"
                  r"(?:\s|&nbsp;)*"
                  r"(\d{2}/\d{2}/\d{4})",
                  html,
                  re.IGNORECASE
              )

              if not titolo:
                  raise Exception(
                      "ADM: titolo estrazione non trovato."
                  )

              progressivo_trovato = int(
                  titolo.group(1)
              )

              if progressivo_trovato != progressivo:
                  raise Exception(
                      "ADM: progressivo diverso. "
                      + "Richiesto "
                      + str(progressivo)
                      + ", trovato "
                      + str(progressivo_trovato)
                      + "."
                  )

              data_estrazione = datetime.strptime(
                  titolo.group(2),
                  "%d/%m/%Y"
              ).date()

              if data_estrazione.year != anno:
                  raise Exception(
                      "ADM: anno non coerente. "
                      + "Richiesto "
                      + str(anno)
                      + ", restituita data "
                      + data_estrazione.strftime("%d/%m/%Y")
                      + "."
                  )

              numeri = []

              for nome_ruota in NOMI_RUOTE_ADM:

                  inizio = html.find(
                      ">" + nome_ruota + "</h3>"
                  )

                  if inizio == -1:
                      raise Exception(
                          "ADM: ruota "
                          + nome_ruota
                          + " non trovata."
                      )

                  fine = html.find(
                      "Numero Oro:",
                      inizio
                  )

                  if fine == -1:
                      raise Exception(
                          "ADM: fine dati ruota "
                          + nome_ruota
                          + " non trovata."
                      )

                  blocco = html[inizio:fine]

                  estratti = re.findall(
                      r'<span class="mr-2">(\d{1,2})</span>',
                      blocco
                  )

                  if len(estratti) != 5:
                      raise Exception(
                          "ADM: numero estratti non corretto "
                          "sulla ruota "
                          + nome_ruota
                          + "."
                      )

                  valori = [
                      int(x)
                      for x in estratti
                  ]

                  for valore in valori:

                      if valore < 1 or valore > 90:
                          raise Exception(
                              "ADM: estratto fuori intervallo."
                          )

                  if len(set(valori)) != 5:
                      raise Exception(
                          "ADM: estratti duplicati sulla ruota "
                          + nome_ruota
                          + "."
                      )

                  numeri.append(valori)

              if len(numeri) != 11:
                  raise Exception(
                      "ADM: numero ruote non corretto."
                  )

              return {
                  "progressivo": progressivo_trovato,
                  "data": data_estrazione,
                  "numeri": numeri
              }


          # ============================================================
          # ULTIMA ESTRAZIONE DELL'ANNO PRECEDENTE
          # ============================================================

          def trova_ultimo_riferimento_anno_adm(anno):

              print("")
              print(
                  "CAMBIO ANNO: cerco ultima estrazione del",
                  anno
              )

              try:

                  elenco_dicembre = (
                      scarica_elenco_mensile_adm(
                          anno,
                          12
                      )
                  )

              except Exception as ex:

                  raise Exception(
                      "ADM: impossibile individuare "
                      "l'ultima estrazione dell'anno "
                      + str(anno)
                      + "."
                  ) from ex

              if not elenco_dicembre:
                  raise Exception(
                      "ADM: nessuna estrazione trovata "
                      "in dicembre "
                      + str(anno)
                      + "."
                  )

              ultimo = max(
                  elenco_dicembre,
                  key=lambda x: x["data"]
              )

              if ultimo["data"].year != anno:
                  raise Exception(
                      "ADM: anno non coerente "
                      "nell'ultima estrazione del "
                      + str(anno)
                      + "."
                  )

              print(
                  "Ultima estrazione ADM",
                  anno,
                  ":",
                  ultimo["progressivo"],
                  "-",
                  ultimo["data"].strftime("%d/%m/%Y")
              )

              return ultimo


          # ============================================================
          # INIZIO TEST
          # ============================================================

          print("")
          print("========================================")
          print(" LOTTOOLS - TEST CAMBIO ANNO RINFORZATO")
          print("========================================")
          print("")
          print(
              "Controlli:"
          )
          print(
              "- progressivi ADM percorsi uno per uno"
          )
          print(
              "- date ADM strettamente decrescenti"
          )
          print(
              "- cambio anno controllato"
          )
          print(
              "- aggancio esatto alla data archivio"
          )
          print(
              "- 11 ruote x 5 estratti validati"
          )
          print("")
          print(
              "AggArcMob.txt NON verrà modificato."
          )
          print("")

          ultima_data_test = datetime.strptime(
              "23/12/2025",
              "%d/%m/%Y"
          ).date()

          print(
              "Archivio simulato fermo al:",
              ultima_data_test.strftime("%d/%m/%Y")
          )


          # ============================================================
          # TROVO ULTIMA ADM
          # ============================================================

          ultimo = scarica_ultimo_riferimento_adm()

          print(
              "Ultima estrazione ADM:",
              ultimo["progressivo"],
              "-",
              ultimo["data"].strftime("%d/%m/%Y")
          )

          if ultimo["data"] <= ultima_data_test:
              raise Exception(
                  "TEST non valido: nessuna estrazione "
                  "successiva alla data simulata."
              )


          # ============================================================
          # RICOSTRUZIONE RINFORZATA
          # ============================================================

          anno_adm = ultimo["data"].year
          progressivo_adm = ultimo["progressivo"]

          riferimenti = []

          cambio_anno_eseguito = False

          # Memorizza l'ultima estrazione già letta andando
          # all'indietro. La successiva deve avere SEMPRE
          # una data strettamente precedente.
          data_successiva = None

          # Serve per controllare che nello stesso anno
          # i progressivi siano realmente N, N-1, N-2...
          progressivo_successivo = None
          anno_successivo = None

          print("")
          print(
              "Inizio ricostruzione all'indietro..."
          )
          print("")

          while True:

              if progressivo_adm < 1:

                  anno_precedente = anno_adm - 1

                  print("")
                  print("========================================")
                  print(
                      " CAMBIO ANNO "
                      + str(anno_adm)
                      + " -> "
                      + str(anno_precedente)
                  )
                  print("========================================")

                  ultimo_anno_precedente = (
                      trova_ultimo_riferimento_anno_adm(
                          anno_precedente
                      )
                  )

                  # La data dell'ultima estrazione dell'anno
                  # precedente deve essere precedente alla prima
                  # estrazione già letta dell'anno successivo.
                  if (
                      data_successiva is not None
                      and
                      ultimo_anno_precedente["data"]
                      >= data_successiva
                  ):
                      raise Exception(
                          "TEST FALLITO: data non coerente "
                          "nel cambio anno."
                      )

                  anno_adm = anno_precedente

                  progressivo_adm = (
                      ultimo_anno_precedente["progressivo"]
                  )

                  # Al cambio anno il progressivo riparte.
                  # Non confrontiamo numericamente i progressivi
                  # appartenenti a due anni diversi.
                  progressivo_successivo = None
                  anno_successivo = None

                  cambio_anno_eseguito = True


              estrazione = scarica_estrazione_adm(
                  anno_adm,
                  progressivo_adm
              )


              # ========================================================
              # CONTROLLO PROGRESSIVITA' ADM
              # ========================================================

              if (
                  progressivo_successivo is not None
                  and anno_successivo == anno_adm
              ):

                  if (
                      estrazione["progressivo"]
                      != progressivo_successivo - 1
                  ):
                      raise Exception(
                          "TEST FALLITO: sequenza progressivi ADM "
                          "interrotta nell'anno "
                          + str(anno_adm)
                          + "."
                      )


              # ========================================================
              # CONTROLLO PROGRESSIVITA' DATE
              # ========================================================

              if data_successiva is not None:

                  if estrazione["data"] >= data_successiva:
                      raise Exception(
                          "TEST FALLITO: date ADM non "
                          "strettamente decrescenti. "
                          + estrazione["data"].strftime(
                              "%d/%m/%Y"
                          )
                          + " non precede "
                          + data_successiva.strftime(
                              "%d/%m/%Y"
                          )
                          + "."
                      )


              print(
                  "ADM",
                  estrazione["progressivo"],
                  "-",
                  estrazione["data"].strftime("%d/%m/%Y"),
                  "- progressivo OK - data OK"
              )


              # ========================================================
              # AGGANCIO ALL'ARCHIVIO
              # ========================================================

              if estrazione["data"] <= ultima_data_test:

                  if estrazione["data"] != ultima_data_test:

                      raise Exception(
                          "TEST FALLITO: aggancio non esatto. "
                          + "Attesa "
                          + ultima_data_test.strftime(
                              "%d/%m/%Y"
                          )
                          + ", raggiunta "
                          + estrazione["data"].strftime(
                              "%d/%m/%Y"
                          )
                          + "."
                      )

                  print("")
                  print(
                      "AGGANCIO ESATTO AL 23/12/2025: OK"
                  )

                  break


              riferimenti.append({
                  "progressivo": estrazione["progressivo"],
                  "data": estrazione["data"]
              })


              data_successiva = estrazione["data"]

              progressivo_successivo = (
                  estrazione["progressivo"]
              )

              anno_successivo = anno_adm

              progressivo_adm -= 1


          # ============================================================
          # CONTROLLI FINALI
          # ============================================================

          if not cambio_anno_eseguito:
              raise Exception(
                  "TEST FALLITO: cambio anno non attraversato."
              )

          if not riferimenti:
              raise Exception(
                  "TEST FALLITO: nessuna estrazione ricostruita."
              )

          riferimenti.sort(
              key=lambda x: x["data"]
          )


          # Dopo averle ordinate cronologicamente,
          # controllo nuovamente le date in avanti.

          data_precedente = ultima_data_test

          for rif in riferimenti:

              if rif["data"] <= data_precedente:
                  raise Exception(
                      "TEST FALLITO: sequenza cronologica finale "
                      "non strettamente crescente."
                  )

              data_precedente = rif["data"]


          if riferimenti[-1]["data"] != ultimo["data"]:
              raise Exception(
                  "TEST FALLITO: ultima data ricostruita "
                  "diversa dall'ultima ADM."
              )


          if (
              riferimenti[-1]["progressivo"]
              != ultimo["progressivo"]
          ):
              raise Exception(
                  "TEST FALLITO: ultimo progressivo "
                  "diverso dall'ultima ADM."
              )


          # ============================================================
          # RISULTATO
          # ============================================================

          print("")
          print("========================================")
          print(" TEST CAMBIO ANNO RINFORZATO SUPERATO!")
          print("========================================")
          print("")
          print(
              "Progressivi ADM consecutivi: OK"
          )
          print(
              "Date ADM strettamente ordinate: OK"
          )
          print(
              "Cambio anno attraversato: OK"
          )
          print(
              "Aggancio esatto al 23/12/2025: OK"
          )
          print(
              "Sequenza cronologica finale: OK"
          )
          print(
              "11 ruote x 5 estratti per ogni ADM: OK"
          )
          print("")
          print(
              "Estrazioni mancanti ricostruite:",
              len(riferimenti)
          )
          print(
              "Ultima estrazione raggiunta:",
              riferimenti[-1]["progressivo"],
              "-",
              riferimenti[-1]["data"].strftime("%d/%m/%Y")
          )
          print("")
          print(
              "AggArcMob.txt NON modificato."
          )
          print(
              "Nessun commit eseguito."
          )
